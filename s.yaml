edition: 3.0.0
access: '${env("FC_CERTBOT_ACCESS", "default")}'
vars:
  fcDomainManagerFunctionName: '${env("FC_DOMAIN_MANAGER_FUNCTION_NAME", "fc-domain-manager")}'
  certGeneratorFunctionName: '${env("CERT_GENERATOR_FUNCTION_NAME", "cert-generator")}'
  role: ${env("FC_CERTBOT_ROLE_ARN")}
  certbotEmail: ${env("CERTBOT_EMAIL")}
resources:
  cert-generator-hz:
    component: fc3
    actions:
      pre-deploy:
        - run: bash scripts/build-deps.sh
          path: ./cert-generator
    props:
      region: cn-hangzhou
      handler: index.handler
      role: ${vars.role}
      timeout: 900
      cpu: 1
      memorySize: 2048
      diskSize: 10240
      internetAccess: true
      functionName: ${vars.certGeneratorFunctionName}
      runtime: python3.12
      environmentVariables:
        PYTHONPATH: /opt/python:/code/python:/code
        CERTBOT_EMAIL: ${vars.certbotEmail}
      code: ./cert-generator
      asyncInvokeConfig:
        asyncTask: true
        maxAsyncEventAgeInSeconds: 86400
        maxAsyncRetryAttempts: 3
  cert-generator-sg:
    component: fc3
    actions:
      pre-deploy:
        - run: bash scripts/build-deps.sh
          path: ./cert-generator
    props:
      region: ap-southeast-1
      handler: index.handler
      role: ${vars.role}
      timeout: 900
      cpu: 1
      memorySize: 2048
      diskSize: 10240
      internetAccess: true
      functionName: ${vars.certGeneratorFunctionName}
      runtime: python3.12
      environmentVariables:
        PYTHONPATH: /opt/python:/code/python:/code
        CERTBOT_EMAIL: ${vars.certbotEmail}
      code: ./cert-generator
      asyncInvokeConfig:
        asyncTask: true
        maxAsyncEventAgeInSeconds: 86400
        maxAsyncRetryAttempts: 3
  fc-domain-manager-hz:
    component: fc3
    actions:
      pre-deploy:
        - run: npm ci --production --no-audit --no-fund
          path: ./fc-domain-manager
    props:
      region: cn-hangzhou
      handler: index.handler
      role: ${vars.role}
      timeout: 900
      cpu: 2
      memorySize: 4096
      diskSize: 10240
      internetAccess: true
      functionName: ${vars.fcDomainManagerFunctionName}
      runtime: nodejs20
      environmentVariables:
        CUSTOM_DOMAIN_REGIONS: cn-beijing,cn-hangzhou,cn-shanghai,cn-qingdao,cn-zhangjiakou,cn-huhehaote,cn-shenzhen,cn-chengdu
        CERT_GENERATOR_FUNCTION_NAME: ${vars.certGeneratorFunctionName}
      code: ./fc-domain-manager
      triggers:
        - triggerConfig:
            payload: ""
            cronExpression: CRON_TZ=Asia/Shanghai 0 0 0 * * *
            enable: true
          triggerName: time-trigger
          qualifier: LATEST
          triggerType: timer
  fc-domain-manager-sg:
    component: fc3
    actions:
      pre-deploy:
        - run: npm ci --production --no-audit --no-fund
          path: ./fc-domain-manager
    props:
      region: ap-southeast-1
      handler: index.handler
      role: ${vars.role}
      timeout: 900
      cpu: 2
      memorySize: 4096
      diskSize: 10240
      internetAccess: true
      functionName: ${vars.fcDomainManagerFunctionName}
      runtime: nodejs20
      environmentVariables:
        CUSTOM_DOMAIN_REGIONS: cn-hongkong,ap-southeast-1,ap-southeast-3,ap-southeast-5,ap-southeast-7,ap-northeast-1,ap-northeast-2,eu-central-1,eu-west-1,us-west-1,us-east-1
        CERT_GENERATOR_FUNCTION_NAME: ${vars.certGeneratorFunctionName}
      code: ./fc-domain-manager
      triggers:
        - triggerConfig:
            payload: ""
            cronExpression: CRON_TZ=Asia/Shanghai 0 0 1 * * *
            enable: true
          triggerName: time-trigger
          qualifier: LATEST
          triggerType: timer
